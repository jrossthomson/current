blueprint_name: openfold-production
vars:
  project_id: "YOUR_PROJECT_ID"  # <--- CLIENT UPDATE REQUIRED
  deployment_name: "openfold-prod"
  region: "northamerica-northeast2"
  zone: "northamerica-northeast2-a"

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc
    settings:
      network_name: "${deployment_name}-net"
      subnetworks:
      - subnet_name: "${deployment_name}-subnet"
        subnet_region: "${region}"
        subnet_cidr: "10.0.0.0/24"

  - id: gke_cluster
    source: modules/scheduler/gke-cluster
    use: [network]
    settings:
      cluster_name: "${deployment_name}"
      enable_private_nodes: true
      master_authorized_networks:
      - cidr_block: "0.0.0.0/0"
        display_name: "All"

  # GPU NODE POOL: NVIDIA L4 (Cost-Effective Inference)
  - id: pool_inference
    source: modules/compute/gke-node-pool
    use: [gke_cluster]
    settings:
      name: "inference-pool-l4"
      machine_type: "g2-standard-12"
      initial_node_count: 1
      max_node_count: 5
      autoscaling: true
      disk_size_gb: 200

  # STORAGE: Filestore Enterprise (REQUIRED for 3TB DBs)
  - id: filestore_storage
    source: modules/file-system/filestore
    use: [network]
    settings:
      name: "${deployment_name}-fs"
      location: "${zone}"
      tier: "ENTERPRISE"
      file_share_name: "openfold_root"
      capacity_gb: 4096 # 4TB Minimum
