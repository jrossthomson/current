apiVersion: v1
kind: ConfigMap
metadata:
  name: download-script
data:
  download_data.sh: |
    # Paste content of scripts/download_data.sh here OR use kubectl create configmap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openfold-mirror
spec:
  template:
    spec:
      containers:
      - name: mirror
        image: bitnami/minideb:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            apt-get update && apt-get install -y aria2 wget rsync git

            BASE="/mnt/storage"
            mkdir -p $BASE/weights $BASE/pdb_data

            echo "--- 1. DOWNLOAD WEIGHTS ---"
            cd $BASE/weights
            aria2c -x 16 -s 16 -c -o of3_ft3_v1.pt "https://huggingface.co/OpenFold/OpenFold3/resolve/main/of3_ft3_v1.pt"
            
            echo "--- 2. DOWNLOAD GENETIC DATABASES ---"
            # Runs the mounted script
            bash /scripts/download_data.sh $BASE/pdb_data

            echo "✅ Data Mirror Complete."
        volumeMounts:
        - name: data-storage
          mountPath: /mnt/storage
        - name: script-vol
          mountPath: /scripts
      restartPolicy: OnFailure
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: openfold-pvc
      - name: script-vol
        configMap:
          name: download-script
          defaultMode: 0777
