apiVersion: batch/v1
kind: Job
metadata:
  name: openfold-run
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: worker
        image: gcr.io/YOUR_PROJECT_ID/openfold3:latest # <--- UPDATE THIS
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "64Gi" 
        env:
        - name: XDG_CACHE_HOME
          value: /mnt/storage/cache
        volumeMounts:
        - name: data-storage
          mountPath: /mnt/storage
        - name: input-config
          mountPath: /inputs
        - name: repair-script-vol
          mountPath: /scripts
        command: ["/bin/bash", "-c"]
        args:
          - |
            source /opt/conda/etc/profile.d/conda.sh
            conda activate base

            echo "--- STEP 1: Normalize Data ---"
            python3 /scripts/repair_json.py

            echo "--- STEP 2: Run Offline Inference ---"
            run_openfold predict \
                 --query_json /tmp/fixed_input.json \
                 --output_dir /mnt/storage/final_results \
                 --inference_ckpt_path /mnt/storage/weights/of3_ft3_v1.pt \
                 --database_dir /mnt/storage/pdb_data \
                 --skip_download \
                 --jackhmmer_binary_path /usr/bin/jackhmmer \
                 --hhblits_binary_path /usr/bin/hhblits

            echo "✅ Job Complete."
      restartPolicy: OnFailure
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: openfold-pvc
      - name: input-config
        configMap:
          name: input-data
      - name: repair-script-vol
        configMap:
          name: repair-script
